openapi: 3.0.3

info:
  title: REST API Marketplace UMKM
  description: >
    Proyek ini merupakan platform marketplace berbasis web menggunakan Laravel yang memungkinkan banyak UMKM berjualan dalam satu sistem. Data setiap UMKM dipisahkan menggunakan client_id agar tidak tercampur. Admin Platform bertugas memverifikasi toko, sedangkan pemilik UMKM dapat mengelola profil, produk, kategori, dan stok.Fitur utama proyek ini adalah Custom Pesanan, yang memungkinkan pembeli memberikan permintaan khusus seperti ukuran, warna, motif, bahan, atau catatan pengerjaan. UMKM dapat menerima atau menolak permintaan tersebut.Sistem juga mendukung checkout dari beberapa toko dalam satu keranjang. Pesanan akan otomatis dibagi menjadi sub-order berdasarkan UMKM. Selain itu, tersedia pengelolaan pembayaran, status pesanan, laporan omzet, serta RESTful API yang dapat digunakan untuk terhubung dengan aplikasi mobile seperti Flutter atau Android.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local Development Server

tags:
  - name: Produk
    description: Operasi data produk UMKM

paths:
  /api/produk:
    get:
      tags:
        - Produk
      summary: Mengambil seluruh data produk
      description: Mengembalikan daftar seluruh produk. Dapat difilter berdasarkan id_umkm dan status_produk.
      operationId: getAllProduk
      parameters:
        - name: id_umkm
          in: query
          required: false
          description: Filter produk berdasarkan ID UMKM
          schema:
            type: integer
            example: 1
        - name: status_produk
          in: query
          required: false
          description: Filter produk berdasarkan status
          schema:
            type: string
            enum:
              - AKTIF
              - NONAKTIF
              - HABIS
            example: AKTIF
      responses:
        '200':
          description: Data produk berhasil ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdukListResponse'
        '500':
          description: Terjadi kesalahan pada server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Produk
      summary: Menambahkan produk baru
      description: Menambahkan satu data produk baru.
      operationId: createProduk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdukInput'
            example:
              id_umkm: 1
              nama_produk: "Kopi Arabika"
              deskripsi: "Kopi arabika premium"
              harga_asli: 45000
              stok: 20
              gambar: "https://example.com/kopi.jpg"
              status_produk: "AKTIF"
      responses:
        '201':
          description: Produk berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdukResponse'
        '400':
          description: Data yang dikirim tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Terjadi kesalahan pada server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/produk/{id}:
    get:
      tags:
        - Produk
      summary: Mengambil produk berdasarkan ID
      description: Mengembalikan satu data produk berdasarkan ID.
      operationId: getProdukById
      parameters:
        - name: id
          in: path
          description: ID produk
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Data produk ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdukResponse'
        '404':
          description: Produk tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Terjadi kesalahan pada server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Produk
      summary: Memperbarui data produk
      description: Mengubah data produk berdasarkan ID.
      operationId: updateProduk
      parameters:
        - name: id
          in: path
          description: ID produk
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdukUpdateInput'
            example:
              nama_produk: "Kopi Arabika Premium"
              harga_asli: 50000
              stok: 15
              status_produk: "AKTIF"
      responses:
        '200':
          description: Data produk berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdukResponse'
        '400':
          description: Data yang dikirim tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Produk tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Terjadi kesalahan pada server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Produk
      summary: Menghapus data produk
      description: Menghapus produk berdasarkan ID.
      operationId: deleteProduk
      parameters:
        - name: id
          in: path
          description: ID produk
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Produk berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '404':
          description: Produk tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Terjadi kesalahan pada server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Produk:
      type: object
      properties:
        id_produk:
          type: integer
          example: 1
        id_umkm:
          type: integer
          example: 1
        nama_produk:
          type: string
          example: "Kopi Arabika"
        deskripsi:
          type: string
          example: "Kopi arabika premium"
        harga_asli:
          type: number
          format: double
          example: 45000
        stok:
          type: integer
          example: 20
        gambar:
          type: string
          example: "https://example.com/kopi.jpg"
        status_produk:
          type: string
          enum:
            - AKTIF
            - NONAKTIF
            - HABIS
          example: "AKTIF"

    ProdukInput:
      type: object
      required:
        - id_umkm
        - nama_produk
        - harga_asli
        - stok
      properties:
        id_umkm:
          type: integer
          example: 1
        nama_produk:
          type: string
          example: "Kopi Arabika"
        deskripsi:
          type: string
          example: "Kopi arabika premium"
        harga_asli:
          type: number
          format: double
          example: 45000
        stok:
          type: integer
          example: 20
        gambar:
          type: string
          example: "https://example.com/kopi.jpg"
        status_produk:
          type: string
          enum:
            - AKTIF
            - NONAKTIF
            - HABIS
          example: "AKTIF"

    ProdukUpdateInput:
      type: object
      properties:
        id_umkm:
          type: integer
          example: 1
        nama_produk:
          type: string
          example: "Kopi Arabika Premium"
        deskripsi:
          type: string
          example: "Kopi arabika premium"
        harga_asli:
          type: number
          format: double
          example: 50000
        stok:
          type: integer
          example: 15
        gambar:
          type: string
          example: "https://example.com/kopi.jpg"
        status_produk:
          type: string
          enum:
            - AKTIF
            - NONAKTIF
            - HABIS
          example: "AKTIF"

    ProdukResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        data:
          $ref: '#/components/schemas/Produk'

    ProdukListResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        data:
          type: array
          items:
            $ref: '#/components/schemas/Produk'

    DeleteResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Produk berhasil dihapus"

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: "error"
        message:
          type: string
          example: "Produk tidak ditemukan"