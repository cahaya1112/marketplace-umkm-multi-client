components:

  responses:
    BadRequest:
      description: Data yang dikirim tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Terjadi kesalahan pada server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DeleteResponse:
      description: Data berhasil dihapus
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteResponse'

  schemas:

    Pembeli:
      type: object
      properties:
        id_pembeli:
          type: integer
          example: 1
        nama:
          type: string
          example: Budi
        email:
          type: string
          format: email
          example: budi@example.com
        kata_sandi_hash:
          type: string
          example: hashed_password
        no_telepon:
          type: string
          example: "08123456789"
        alamat:
          type: string
          example: Jl. Contoh No. 1

    PembeliInput:
      type: object
      required: [nama, email, kata_sandi_hash]
      properties:
        nama:
          type: string
        email:
          type: string
          format: email
        kata_sandi_hash:
          type: string
        no_telepon:
          type: string
        alamat:
          type: string

    PembeliUpdateInput:
      type: object
      properties:
        nama:
          type: string
        email:
          type: string
          format: email
        kata_sandi_hash:
          type: string
        no_telepon:
          type: string
        alamat:
          type: string

    AdminUmkm:
      type: object
      properties:
        id_admin_umkm:
          type: integer
          example: 1
        id_umkm:
          type: integer
          example: 1
        nama:
          type: string
          example: Admin UMKM A
        email:
          type: string
          format: email
          example: admin@umkm.com
        kata_sandi_hash:
          type: string
          example: hashed_password

    AdminUmkmInput:
      type: object
      required: [id_umkm, nama, email, kata_sandi_hash]
      properties:
        id_umkm:
          type: integer
        nama:
          type: string
        email:
          type: string
          format: email
        kata_sandi_hash:
          type: string

    AdminUmkmUpdateInput:
      type: object
      properties:
        id_umkm:
          type: integer
        nama:
          type: string
        email:
          type: string
          format: email
        kata_sandi_hash:
          type: string

    SuperAdmin:
      type: object
      properties:
        id_super_admin:
          type: integer
          example: 1
        nama:
          type: string
          example: Super Admin
        email:
          type: string
          format: email
          example: superadmin@example.com
        kata_sandi_hash:
          type: string
          example: hashed_password

    SuperAdminInput:
      type: object
      required: [nama, email, kata_sandi_hash]
      properties:
        nama:
          type: string
        email:
          type: string
          format: email
        kata_sandi_hash:
          type: string

    SuperAdminUpdateInput:
      type: object
      properties:
        nama:
          type: string
        email:
          type: string
          format: email
        kata_sandi_hash:
          type: string

    Umkm:
      type: object
      properties:
        id_umkm:
          type: integer
          example: 1
        nama_umkm:
          type: string
          example: UMKM Maju Jaya
        deskripsi:
          type: string
          example: Menjual makanan ringan
        alamat:
          type: string
          example: Jl. UMKM No. 1
        no_telepon:
          type: string
          example: "08123456789"
        status_verifikasi:
          type: string
          enum: [MENUNGGU, AKTIF, DITOLAK, NONAKTIF]
          example: MENUNGGU
        id_super_admin_verifikator:
          type: integer
          nullable: true
          example: 1
        tanggal_verifikasi:
          type: string
          format: date-time
          nullable: true
          example: "2026-01-01T10:00:00Z"

    UmkmInput:
      type: object
      required: [nama_umkm]
      properties:
        nama_umkm:
          type: string
        deskripsi:
          type: string
        alamat:
          type: string
        no_telepon:
          type: string
        status_verifikasi:
          type: string
          enum: [MENUNGGU, AKTIF, DITOLAK, NONAKTIF]
        id_super_admin_verifikator:
          type: integer
          nullable: true
        tanggal_verifikasi:
          type: string
          format: date-time
          nullable: true

    UmkmUpdateInput:
      type: object
      properties:
        nama_umkm:
          type: string
        deskripsi:
          type: string
        alamat:
          type: string
        no_telepon:
          type: string
        status_verifikasi:
          type: string
          enum: [MENUNGGU, AKTIF, DITOLAK, NONAKTIF]
        id_super_admin_verifikator:
          type: integer
          nullable: true
        tanggal_verifikasi:
          type: string
          format: date-time
          nullable: true

    Produk:
      type: object
      properties:
        id_produk:
          type: integer
          example: 1
        id_umkm:
          type: integer
          example: 1
        nama_produk:
          type: string
          example: Keripik Pisang
        deskripsi:
          type: string
          example: Keripik pisang renyah
        harga_asli:
          type: number
          format: double
          example: 15000
        stok:
          type: integer
          example: 100
        gambar:
          type: string
          example: /uploads/keripik.jpg
        status_produk:
          type: string
          enum: [AKTIF, NONAKTIF, HABIS]
          example: AKTIF

    ProdukInput:
      type: object
      required: [id_umkm, nama_produk, harga_asli, stok]
      properties:
        id_umkm:
          type: integer
        nama_produk:
          type: string
        deskripsi:
          type: string
        harga_asli:
          type: number
          format: double
        stok:
          type: integer
        gambar:
          type: string
        status_produk:
          type: string
          enum: [AKTIF, NONAKTIF, HABIS]

    ProdukUpdateInput:
      type: object
      properties:
        id_umkm:
          type: integer
        nama_produk:
          type: string
        deskripsi:
          type: string
        harga_asli:
          type: number
          format: double
        stok:
          type: integer
        gambar:
          type: string
        status_produk:
          type: string
          enum: [AKTIF, NONAKTIF, HABIS]

    Kategori:
      type: object
      properties:
